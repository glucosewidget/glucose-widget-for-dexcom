# GlucoseWidgetForDexcom.exe を GitHub Actions で作る
# - main への push・プルリクエスト：アプリのソースが変わったときだけ exe を作って Artifacts に置く
#   （版数は version_info.txt のまま。README などだけの変更ではビルドしない）
# - 手動実行（Actions → Build exe → Run workflow）：版数（例 0.1.0-beta）を指定して exe を作る。
#   「Releases にプレリリースとして公開」をオンにすると、v<版数> のタグを付けて Releases にも添付する
# - v で始まるタグ（例 v0.1.0）の push：タグの版数で exe を作り、Releases に添付する
#   （タグの push には paths の絞り込みは効かないので、必ずビルドする）
# いずれも版数に - を含む（例 0.1.0-beta）ときはプレリリースにする
name: Build exe

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "glucose_widget.py"
      - "glucosewidget/**"
      - "requirements.txt"
      - "version_info.txt"
      - "icon.ico"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "glucose_widget.py"
      - "glucosewidget/**"
      - "requirements.txt"
      - "version_info.txt"
      - "icon.ico"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版数（例 0.1.0-beta）"
        required: true
        default: "0.1.0-beta"
      publish:
        description: "Releases にプレリリースとして公開する（v<版数> のタグを付ける）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $v = $env:INPUT_VERSION.Trim() }
          elseif ($env:GITHUB_REF_TYPE -eq "tag") { $v = $env:GITHUB_REF_NAME -replace '^v', '' }
          else { $v = "" }
          if ($v -and $v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            Write-Error "版数の形式が違います: '$v'（例 0.1.0 / 0.1.0-beta）"; exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($v) { "版数: $v" } else { "版数: version_info.txt のまま" }

      # 指定された版数を exe のプロパティ（version_info.txt）に書き込む
      - name: Stamp version
        if: steps.ver.outputs.version != ''
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          $nums = ($env:VER -split '-')[0].Split('.') + @('0')
          $tuple = "($($nums[0]), $($nums[1]), $($nums[2]), 0)"
          $t = Get-Content version_info.txt -Raw -Encoding utf8
          $t = $t -replace 'filevers=\([^)]*\)', "filevers=$tuple"
          $t = $t -replace 'prodvers=\([^)]*\)', "prodvers=$tuple"
          $t = $t -replace "StringStruct\('FileVersion', '[^']*'\)", "StringStruct('FileVersion', '$env:VER')"
          $t = $t -replace "StringStruct\('ProductVersion', '[^']*'\)", "StringStruct('ProductVersion', '$env:VER')"
          Set-Content version_info.txt $t -Encoding utf8 -NoNewline
          Select-String -Path version_info.txt -Pattern 'vers=|Version'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Import check
        run: python -c "import glucosewidget.widget, glucosewidget.settings_dialog; print('import ok')"

      # build_exe.bat と同じ指定
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name GlucoseWidgetForDexcom --icon icon.ico --version-file version_info.txt
          --hidden-import pystray._win32 --add-data "icon.ico;."
          --collect-submodules keyring.backends --copy-metadata keyring
          glucose_widget.py

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/GlucoseWidgetForDexcom.exe -Algorithm SHA256).Hash.ToLower()
          "$h  GlucoseWidgetForDexcom.exe" | Out-File dist/GlucoseWidgetForDexcom.exe.sha256 -Encoding ascii
          Get-Content dist/GlucoseWidgetForDexcom.exe.sha256
          (Get-Item dist/GlucoseWidgetForDexcom.exe).VersionInfo | Format-List FileDescription, ProductName, FileVersion, ProductVersion

      # exe に同梱しているライブラリと Python のライセンス文をまとめる
      - name: Third-party licenses
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "pip-licenses"], check=True)
          out = subprocess.run(
              [sys.executable, "-m", "piplicenses", "--from=mixed", "--with-urls", "--with-license-file",
               "--no-license-path", "--format=plain-vertical",
               "--ignore-packages", "pip-licenses", "prettytable", "wcwidth"],
              check=True, capture_output=True, text=True, encoding="utf-8").stdout
          parts = [
              "GlucoseWidget for Dexcom - third-party software licenses",
              "",
              "GlucoseWidgetForDexcom.exe bundles the Python runtime and the following packages.",
              "Their license texts are reproduced below.",
              "",
              out.rstrip(),
          ]
          py_lic = os.path.join(sys.base_prefix, "LICENSE.txt")
          if os.path.exists(py_lic):
              parts += ["", "Python", sys.version.split()[0], "Python Software Foundation License",
                        open(py_lic, encoding="utf-8", errors="replace").read().rstrip()]
          text = "\n".join(parts) + "\n"
          with open(os.path.join("dist", "THIRD_PARTY_LICENSES.txt"), "w", encoding="utf-8", newline="\n") as f:
              f.write(text)
          print("THIRD_PARTY_LICENSES.txt:", text.count("\n"), "lines")

      - uses: actions/upload-artifact@v4
        with:
          name: GlucoseWidgetForDexcom${{ steps.ver.outputs.version != '' && format('-{0}', steps.ver.outputs.version) || '' }}
          path: |
            dist/GlucoseWidgetForDexcom.exe
            dist/GlucoseWidgetForDexcom.exe.sha256
            dist/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  release:
    # タグの push、または手動実行で「公開する」をオンにしたとき
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlucoseWidgetForDexcom-${{ needs.build.outputs.version }}
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.build.outputs.version }}
          files: |
            dist/GlucoseWidgetForDexcom.exe
            dist/GlucoseWidgetForDexcom.exe.sha256
            dist/THIRD_PARTY_LICENSES.txt
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}

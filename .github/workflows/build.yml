# GlucoseWidgetForDexcom.exe を GitHub Actions で作る
# - main への push・プルリクエスト・手動実行：exe を作って Artifacts に置く
# - v で始まるタグ（例 v0.1.0）の push：さらに GitHub Releases に exe と SHA-256 を添付する
#   （v0.1.0-beta のように - を含むタグはプレリリースにする）
name: Build exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Import check
        run: python -c "import glucosewidget.widget, glucosewidget.settings_dialog; print('import ok')"

      # build_exe.bat と同じ指定
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name GlucoseWidgetForDexcom --icon icon.ico --version-file version_info.txt
          --hidden-import pystray._win32 --add-data "icon.ico;."
          --collect-submodules keyring.backends --copy-metadata keyring
          glucose_widget.py

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/GlucoseWidgetForDexcom.exe -Algorithm SHA256).Hash.ToLower()
          "$h  GlucoseWidgetForDexcom.exe" | Out-File dist/GlucoseWidgetForDexcom.exe.sha256 -Encoding ascii
          Get-Content dist/GlucoseWidgetForDexcom.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: GlucoseWidgetForDexcom
          path: |
            dist/GlucoseWidgetForDexcom.exe
            dist/GlucoseWidgetForDexcom.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlucoseWidgetForDexcom
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GlucoseWidgetForDexcom.exe
            dist/GlucoseWidgetForDexcom.exe.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
